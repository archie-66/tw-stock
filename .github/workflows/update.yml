name: 每日更新台股資料

on:
  schedule:
    # 台北時間 13:37～17:52 每 15 分鐘檢查一次（週一～五）
    # 收盤行情約 14:00 出來、三大法人約 15:00 出來；資料完整後就不會再更新。
    # 故意避開整點：GitHub 整點排程最容易塞車延遲。
    - cron: "37,52 5 * * 1-5"
    - cron: "7,22,37,52 6-9 * * 1-5"
  workflow_dispatch:          # 也可以在 Actions 頁面手動按「Run workflow」

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓證交所資料
        run: python update.py
      - name: 有變動就存檔
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add data.json
          if ! git diff --cached --quiet; then
            git commit -m "更新台股資料 $(TZ=Asia/Taipei date '+%F %H:%M')"
            git pull --rebase -q origin main
            git push
          fi
