name: 每日更新台股資料

on:
  schedule:
    - cron: "20 7 * * 1-5"   # 台北時間 15:20（週一～五）
    - cron: "50 8 * * 1-5"   # 台北時間 16:50 再試一次（萬一第一次資料還沒出來）
  workflow_dispatch:          # 也可以在 Actions 頁面手動按「Run workflow」

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓證交所資料
        run: python update.py
      - name: 有變動就存檔
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "更新台股資料 $(TZ=Asia/Taipei date +%F)" && git push)
